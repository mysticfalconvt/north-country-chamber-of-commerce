# Settings for pnpm (this is a single package, not a monorepo).

# Refuse package versions published less than 14 days ago. Most malicious
# releases are caught and pulled within days, so this keeps them out.
minimumReleaseAge: 20160

# Packages allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver
  - '@sentry/cli'

# Patched versions of nested dependencies.
overrides:
  'browserslist@<4.28.9': 4.28.9
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
  'immutable@>=4.0.0 <4.3.9': 4.3.9
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'lodash@>=4.0.0 <4.18.1': 4.18.1
  'nanoid@>=3.0.0 <3.3.19': 3.3.19
  'picomatch@>=2.0.0 <2.3.2': 2.3.2
  'picomatch@>=4.0.0 <4.0.7': 4.0.7
  'postcss@>=8.0.0 <8.5.28': 8.5.28
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'dompurify@>=3.0.0 <3.4.16': ^3.4.16
  'postcss-selector-parser@>=6.0.0 <6.1.5': ^6.1.5
  'happy-dom@<21.0.4': ^21.0.4
